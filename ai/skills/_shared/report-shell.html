<!--
  CANONICAL base HTML shell for Todd's report/artifact skills.
  Consumed by: todd-html-report, todd-standup, todd-describe-pr, todd-pr-review, todd-diagnose-alert.

  These skills emit SELF-CONTAINED HTML, so they can't @import at runtime — copy this shell verbatim
  as the base of the artifact, then add skill-specific CSS in the marked slot. The point: the shared
  typography + palette (the "same visual language" across every artifact) lives HERE, so a palette or
  font change lands once instead of in five copied-and-drifting blocks.

  - Keep the three `report-*` meta tags for any artifact that feeds the html_report artifacts/ catalog
    (html_report, and anything ingested into it); other skills may drop them.
  - Include the Mermaid <script> only if the artifact has diagrams; drop it otherwise to stay lean.
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title><!-- title --></title>
  <!-- Required for the artifacts/index.html catalog (html_report + ingested files): -->
  <meta name="report-title" content="<!-- title -->">
  <meta name="report-description" content="<!-- one tight line, ≤140 chars, distinct from title -->">
  <meta name="report-date" content="<!-- YYYY-MM-DD -->">
  <style>
    /* ===== shared design tokens — edit HERE to restyle every artifact ===== */
    :root { color-scheme: light; }
    body { font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           max-width: 980px; margin: 2.5rem auto; padding: 0 1.25rem; color: #1f2328; }
    h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
    .meta { color: #57606a; font-size: 0.85rem; margin-bottom: 2rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em;
         color: #57606a; margin: 2rem 0 0.5rem; }
    p  { margin: 0 0 1rem; }
    a  { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
           background: #f6f8fa; padding: 1px 4px; border-radius: 3px; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #d0d7de; }
    th { background: #f6f8fa; position: sticky; top: 0; font-weight: 600; }
    .mermaid { margin: 1.5rem 0; }
    .caption { color: #57606a; font-size: 0.85rem; margin-top: -0.5rem; margin-bottom: 1.5rem; }

    /* ===== skill-specific styles go BELOW this line (cards, diff, verdict banner, standup h3s, …) ===== */
  </style>
  <!-- Only if the artifact uses diagrams. (SRI note: the floating @10 tag can't carry a stable
       integrity hash; if you pin an exact version, add integrity="sha384-…" crossorigin="anonymous".) -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: "default" });</script>
</head>
<body>
  <!-- artifact content -->
</body>
</html>
